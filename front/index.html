<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Étudiants</title>
    <!-- Tailwind CSS pour un design propre instantané -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Axios pour communiquer avec le backend -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Gestion des Étudiants (MERN)</h1>

        <!-- Message d'alerte -->
        <div id="message" class="hidden mb-4 p-3 rounded text-center text-sm font-semibold"></div>

        <!-- Formulaire -->
        <form id="etudiantForm" class="bg-gray-50 p-4 rounded-md border border-gray-200 mb-6">
            <h2 id="formTitle" class="text-lg font-semibold text-gray-700 mb-3">Ajouter un étudiant</h2>
            <input type="hidden" id="editId">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                <input type="text" id="nom" placeholder="Nom complet" required class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" id="email" placeholder="E-mail" required class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="age" placeholder="Âge" required class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-2">
                <button type="submit" id="submitBtn" class="bg-green-600 text-white px-4 py-2 rounded font-semibold hover:bg-green-700">Ajouter</button>
                <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-gray-500 text-white px-4 py-2 rounded font-semibold hover:bg-gray-600">Annuler</button>
            </div>
        </form>

        <!-- Liste des étudiants -->
        <h2 class="text-lg font-semibold text-gray-700 mb-3">Liste des étudiants</h2>
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-gray-200 text-left text-sm">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border border-gray-200 p-2">Nom</th>
                        <th class="border border-gray-200 p-2">E-mail</th>
                        <th class="border border-gray-200 p-2">Âge</th>
                        <th class="border border-gray-200 p-2 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="etudiantsTableBody">
                    <!-- Les données s'afficheront ici dynamiquement -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
      const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000/api/etudiants"
    : "/api/etudiants";

        async function chargerEtudiants() {
            try {
                const res = await axios.get(API_URL);
                const tbody = document.getElementById("etudiantsTableBody");
                tbody.innerHTML = "";
                
                if (res.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-500">Aucun étudiant trouvé.</td></tr>`;
                    return;
                }

                res.data.forEach(etudiant => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="border border-gray-200 p-2">${etudiant.nom}</td>
                            <td class="border border-gray-200 p-2">${etudiant.email}</td>
                            <td class="border border-gray-200 p-2">${etudiant.age} ans</td>
                            <td class="border border-gray-200 p-2 text-center space-x-2">
                                <button onclick="preparerModification('${etudiant._id}', '${etudiant.nom}', '${etudiant.email}', ${etudiant.age})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">Éditer</button>
                                <button onclick="supprimerEtudiant('${etudiant._id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">Supprimer</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                afficherMessage("Erreur de connexion avec le backend.", "bg-red-100 text-red-700");
            }
        }

        document.getElementById("etudiantForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("editId").value;
            const nom = document.getElementById("nom").value;
            const email = document.getElementById("email").value;
            const age = Number(document.getElementById("age").value);

            try {
                if (id) {
                    await axios.put(`${API_URL}/${id}`, { nom, email, age });
                    afficherMessage("Étudiant modifié avec succès !", "bg-green-100 text-green-700");
                } else {
                    await axios.post(API_URL, { nom, email, age });
                    afficherMessage("Étudiant ajouté avec succès !", "bg-green-100 text-green-700");
                }
                resetForm();
                chargerEtudiants();
            } catch (err) {
                afficherMessage("Une erreur est survenue lors de l'enregistrement.", "bg-red-100 text-red-700");
            }
        });

        async function supprimerEtudiant(id) {
            if (confirm("Voulez-vous vraiment supprimer cet étudiant ?")) {
                try {
                    await axios.delete(`${API_URL}/${id}`);
                    afficherMessage("Étudiant supprimé avec succès !", "bg-green-100 text-green-700");
                    chargerEtudiants();
                } catch (err) {
                    afficherMessage("Erreur lors de la suppression.", "bg-red-100 text-red-700");
                }
            }
        }

        function preparerModification(id, nom, email, age) {
            document.getElementById("editId").value = id;
            document.getElementById("nom").value = nom;
            document.getElementById("email").value = email;
            document.getElementById("age").value = age;
            document.getElementById("formTitle").innerText = "Modifier l'étudiant";
            document.getElementById("submitBtn").innerText = "Enregistrer";
            document.getElementById("submitBtn").className = "bg-blue-600 text-white px-4 py-2 rounded font-semibold hover:bg-blue-700";
            document.getElementById("cancelBtn").classList.remove("hidden");
        }

        function resetForm() {
            document.getElementById("etudiantForm").reset();
            document.getElementById("editId").value = "";
            document.getElementById("formTitle").innerText = "Ajouter un étudiant";
            document.getElementById("submitBtn").innerText = "Ajouter";
            document.getElementById("submitBtn").className = "bg-green-600 text-white px-4 py-2 rounded font-semibold hover:bg-green-700";
            document.getElementById("cancelBtn").classList.add("hidden");
        }

        function afficherMessage(texte, classeCss) {
            const msgDiv = document.getElementById("message");
            msgDiv.className = `mb-4 p-3 rounded text-center text-sm font-semibold ${classeCss}`;
            msgDiv.innerText = texte;
            msgDiv.classList.remove("hidden");
            setTimeout(() => msgDiv.classList.add("hidden"), 4000);
        }

        // Charger la liste au démarrage
        chargerEtudiants();
    </script>
</body>
</html>
